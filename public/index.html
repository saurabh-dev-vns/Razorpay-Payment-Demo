<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - Razorpay</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 30px;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 20px;
      color: #333;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }

    input:focus {
      border-color: #3366cc;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    .pay-btn {
      width: 100%;
      padding: 10px;
      background: #3366cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
    }

    .pay-btn:hover {
      background: #2952a3;
    }

    .pay-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.ok {
      background: #e6f9e6;
      border: 1px solid #a3d9a3;
      color: #2e7d32;
    }

    .msg.err {
      background: #fdecea;
      border: 1px solid #f5c6cb;
      color: #c62828;
    }

    .msg .id {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      color: #aaa;
      font-size: 11px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Make Payment</h2>
    <p class="subtitle">Enter your details below to proceed</p>

    <hr />

    <label for="amount">Amount (INR)</label>
    <input type="number" id="amount" placeholder="500" value="500" min="1" />

    <div class="row">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
    </div>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" placeholder="9876543210" />

    <button class="pay-btn" id="payBtn" onclick="startPayment()">Pay Now</button>

    <div class="msg" id="msg"></div>

    <div class="footer">Powered by Razorpay</div>
  </div>

  <script>
    var payBtn = document.getElementById("payBtn");
    var msgDiv = document.getElementById("msg");

    async function startPayment() {
      var amount = Number(document.getElementById("amount").value);
      if (!amount || amount < 1) {
        alert("Enter a valid amount");
        return;
      }

      payBtn.disabled = true;
      payBtn.textContent = "Please wait...";
      msgDiv.className = "msg";

      try {
        var res = await fetch("/api/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: amount, currency: "INR" }),
        });

        var data = await res.json();
        if (!data.success) throw new Error(data.message);

        var options = {
          key: data.key,
          amount: data.order.amount,
          currency: data.order.currency,
          name: "Payment",
          description: "Order #" + data.order.receipt,
          order_id: data.order.id,
          prefill: {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            contact: document.getElementById("phone").value,
          },
          theme: { color: "#3366cc" },
          handler: async function (response) {
            payBtn.textContent = "Verifying...";
            try {
              var vres = await fetch("/api/verify-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(response),
              });
              var vdata = await vres.json();
              if (vdata.success) {
                showMsg("ok", "Payment successful!", "ID: " + response.razorpay_payment_id);
              } else {
                showMsg("err", "Verification failed", vdata.message);
              }
            } catch (e) {
              showMsg("err", "Error", e.message);
            }
            resetBtn();
          },
          modal: {
            ondismiss: function () {
              resetBtn();
            },
          },
        };

        var rzp = new Razorpay(options);
        rzp.on("payment.failed", function (resp) {
          showMsg("err", "Payment failed", resp.error.description);
          resetBtn();
        });
        rzp.open();
        resetBtn();
      } catch (e) {
        showMsg("err", "Error", e.message);
        resetBtn();
      }
    }

    function showMsg(type, title, detail) {
      msgDiv.className = "msg show " + type;
      msgDiv.innerHTML = "<strong>" + title + "</strong><div class='id'>" + detail + "</div>";
    }

    function resetBtn() {
      payBtn.disabled = false;
      payBtn.textContent = "Pay Now";
    }
  </script>
</body>
</html>
